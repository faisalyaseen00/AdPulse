[theme]
base = "light"
primaryColor = "#14213D"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#EEF0F4"
textColor = "#111318"
font = "sans serif"

[server]
headless = true
runOnSave = false
# serves app/static/ at /app/static/ (the 3D robot icon lives there)
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
# production: visitors see a short generic message, details go to the server log
showErrorDetails = "none"
